<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات المندوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:20px}
.header{background:#ff6a00;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.top-card{background:#fef6ef;margin:15px;border-radius:20px;padding:15px;display:flex;gap:15px;align-items:center}
.top-card img{width:95px;height:95px;border-radius:50%;border:3px solid #ff6a00}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px}
.b-ok{background:#e8f5e9;color:#1b5e20}.b-off{background:#ffebee;color:#b71c1c}.b-road{background:#fff3e0;color:#e65100}.b-block{background:#000;color:white}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 15px}
.s{border-radius:14px;padding:10px;text-align:center}.s b{display:block;font-size:20px}
.s1{background:#e8f5e9}.s2{background:#e3f2fd}.s3{background:#fff3e0}.s4{background:#f3e5f5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px}
.act{border:none;border-radius:12px;padding:12px;font-family:'Cairo';font-weight:800;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.act-green{background:#00a651}.act-red{background:#ff3b30}.act-orange{background:#ff9f0a}
.info-box{background:white;margin:15px;border-radius:20px;padding:15px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
.modal-box{background:white;width:100%;max-width:380px;border-radius:20px;padding:20px}
.modal-box input{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid #ddd;font-family:'Cairo'}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'Cairo';font-weight:800;color:white;cursor:pointer;margin-top:8px}
.back-btn{background:#ff6a00;color:white;border:none;width:calc(100% - 30px);margin:15px;padding:14px;border-radius:14px;font-family:'Cairo';font-weight:800;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer}
.settings-btn{background:#222;color:white;border:none;padding:8px 12px;border-radius:10px;font-family:'Cairo';font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-chevron-left" style="font-size:22px;cursor:pointer" onclick="history.back()"></i>
  <div style="font-size:22px;font-weight:800">بيانات المندوب</div>
  <button class="settings-btn" onclick="openTokenModal()"><i class="fa-solid fa-gear"></i> اعدادات</button>
</div>

<div class="top-card">
  <img id="rImg" src="">
  <div style="flex:1">
    <h2 id="rName" style="margin:0">...</h2>
    <div><i class="fa-solid fa-phone"></i> <span id="rPhone" style="direction:ltr">--</span></div>
  </div>
  <div id="rStatusBadge" class="badge b-ok">--</div>
</div>

<div class="stats">
  <div class="s s1"><i class="fa-solid fa-wallet" style="color:#00a651"></i><b id="sBalance">--</b><small>جنيه<br>رصيد</small></div>
  <div class="s s2"><i class="fa-solid fa-clipboard-check" style="color:#007aff"></i><b id="sOrders">--</b><small>طلب</small></div>
  <div class="s s3"><i class="fa-solid fa-star" style="color:#ff6a00"></i><b>3.5</b><small>تقييم</small></div>
  <div class="s s4"><i class="fa-regular fa-calendar" style="color:#9c27b0"></i><b>12</b><small>يوم</small></div>
</div>

<div class="actions">
  <button class="act act-green" onclick="openCharge('add')"><i class="fa-solid fa-plus"></i> إضافة رصيد</button>
  <button class="act act-red" onclick="openCharge('deduct')"><i class="fa-solid fa-minus"></i> خصم رصيد</button>
  <button class="act" style="background:#222" onclick="updateStatus('محظور')"><i class="fa-solid fa-ban"></i> حظر</button>
  <button class="act act-orange" onclick="updateStatus('موقوف')"><i class="fa-solid fa-pause"></i> إيقاف</button>
</div>

<div class="info-box">
  <div class="row"><span>الاسم</span><b id="dName">--</b></div>
  <div class="row"><span>رقم الهاتف</span><b id="dPhone" style="direction:ltr">--</b></div>
  <div class="row"><span>الرصيد</span><b id="dBal">--</b></div>
  <div class="row"><span style="color:#888;font-size:12px">لاصلاح القراءة الخاطئة</span><b style="color:#ff6a00;cursor:pointer;font-size:12px" onclick="clearLocalCache()">مسح الكاش المحلي</b></div>
</div>

<button class="back-btn" onclick="window.location='index.html'"><i class="fa-solid fa-arrow-left"></i> العودة للقائمة</button>

<div class="modal" id="chargeModal">
  <div class="modal-box">
    <h3 id="chargeTitle">إضافة رصيد للمندوب</h3>
    <input type="number" id="chargeAmount" placeholder="مثلا 100">
    <button class="btn" id="chargeBtn" style="background:#00a651" onclick="doCharge()">تنفيذ</button>
    <button class="btn" style="background:#aaa" onclick="document.getElementById('chargeModal').style.display='none'">إلغاء</button>
  </div>
</div>

<div class="modal" id="tokenModal">
  <div class="modal-box">
    <h3>⚙️ اعداد التوكن</h3>
    <p style="font-size:12px;color:#888">التوكن هيتحفظ في تليفونك بس</p>
    <input type="password" id="tokenInput" placeholder="الصق التوكن هنا ghp_...">
    <button class="btn" style="background:#222" onclick="saveToken()">حفظ التوكن</button>
    <button class="btn" style="background:#ff6a00" onclick="testToken()">اختبار التوكن</button>
    <button class="btn" style="background:#aaa" onclick="document.getElementById('tokenModal').style.display='none'">اغلاق</button>
    <div id="tokenStatus" style="font-size:12px;margin-top:8px;color:#666"></div>
  </div>
</div>

<script>
const OWNER="wwweslamtarek567-netizen";
const REPO="sahlah";
const FILE_PATH="riders.json";
const phone = new URLSearchParams(window.location.search).get('phone');
let currentRider=null;
let chargeType='add';
let riders=[];
let fileSha="";

function getToken(){ return localStorage.getItem('gh_token') || ""; }
function openTokenModal(){
  document.getElementById('tokenInput').value = getToken();
  document.getElementById('tokenStatus').innerText = getToken()? 'يوجد توكن محفوظ ✓' : 'مفيش توكن محفوظ';
  document.getElementById('tokenModal').style.display='flex';
}
function saveToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t) return alert('اكتب التوكن');
  localStorage.setItem('gh_token', t);
  document.getElementById('tokenStatus').innerText='تم حفظ التوكن في تليفونك ✓';
  setTimeout(()=>document.getElementById('tokenModal').style.display='none',800);
}
async function testToken(){
  const token=getToken();
  if(!token) return alert('حط التوكن الاول');
  const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`,{headers:{Authorization:`Bearer ${token}`}});
  document.getElementById('tokenStatus').innerText = res.ok? 'التوكن شغال ✓' : 'التوكن بايظ او منتهي ❌';
}
function clearLocalCache(){
  if(!confirm('امسح البيانات المحلية للمندوب ده واجيب الصح من جيتهب؟')) return;
  localStorage.removeItem('name_'+phone);
  localStorage.removeItem('balance_'+phone);
  localStorage.removeItem('status_'+phone);
  localStorage.removeItem('orders_'+phone);
  location.reload();
}

async function load(){
  let realData=null;
  try{
    const raw=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
    if(raw.ok){
      riders=await raw.json();
      // تطبيع الرقم عشان 01023284996 == 1023284996
      const cleanPhone = String(phone).replace(/\D/g,'').replace(/^0+/,'');
      realData=riders.find(r=>{
        const rp = String(r.phone||'').replace(/\D/g,'').replace(/^0+/,'');
        return rp===cleanPhone;
      });
    }
  }catch(e){}

  try{
    const token=getToken();
    if(token){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{headers:{Authorization:`Bearer ${token}`}});
      if(r.ok){ const d=await r.json(); fileSha=d.sha; }
    }
  }catch(e){}

  // لو الاسم المحلي وهمي امسحه
  let savedName = localStorage.getItem('name_'+phone);
  if(savedName && (savedName.startsWith('مندوب') || /^\d+$/.test(savedName.replace('مندوب','').trim()))){
    localStorage.removeItem('name_'+phone);
    savedName=null;
  }

  // الاولوية لاسم جيتهب الحقيقي
  let finalName = '';
  if(realData?.name && realData.name.trim()!=='' &&!realData.name.startsWith('مندوب ')){
    finalName = realData.name;
    localStorage.setItem('name_'+phone, realData.name);
  } else {
    finalName = savedName || realData?.name || 'مندوب';
  }

  const savedBal=localStorage.getItem('balance_'+phone);
  const savedStatus=localStorage.getItem('status_'+phone);

  const balance = realData?.balance?? (savedBal!==null? parseFloat(savedBal) : 0);
  const status = realData?.status || savedStatus || 'متاح';
  const orders = realData?.orders?? 0;

  currentRider={phone:String(phone), name:finalName, balance, status, orders};

  if(riders.length>0){
    const cleanPhone = String(phone).replace(/\D/g,'').replace(/^0+/,'');
    const idx=riders.findIndex(r=> String(r.phone||'').replace(/\D/g,'').replace(/^0+/,'')===cleanPhone);
    if(idx>-1) riders[idx]={...riders[idx],...currentRider, phone:riders[idx].phone};
  } else {
    riders=[currentRider];
  }
  render();
}

function render(){
  document.getElementById('rPhone').innerText=currentRider.phone;
  document.getElementById('dPhone').innerText=currentRider.phone;
  document.getElementById('rName').innerText=currentRider.name;
  document.getElementById('dName').innerText=currentRider.name;
  document.getElementById('sBalance').innerText=currentRider.balance;
  document.getElementById('dBal').innerText=currentRider.balance+' جنيه';
  document.getElementById('sOrders').innerText=currentRider.orders;
  document.getElementById('rImg').src=`https://ui-avatars.com/api/?name=${encodeURIComponent(currentRider.name)}&background=ff6a00&color=fff&size=128`;
  const badge=document.getElementById('rStatusBadge');
  badge.innerText=currentRider.status;
  badge.className='badge '+(currentRider.status=='متاح'?'b-ok':currentRider.status=='في الطريق'?'b-road':currentRider.status=='محظور'?'b-block':'b-off');
}

async function saveGitHub(msg){
  localStorage.setItem('balance_'+phone, currentRider.balance);
  localStorage.setItem('status_'+phone, currentRider.status);
  localStorage.setItem('name_'+phone, currentRider.name);
  render();
  const token=getToken();
  if(!token){
    alert('تم الحفظ محليا فقط - دوس ⚙️ وحط التوكن');
    return;
  }
  try{
    if(!fileSha){
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{headers:{Authorization:`Bearer ${token}`}});
      if(r.ok){ const d=await r.json(); fileSha=d.sha; }
    }
    const cleanPhone = String(phone).replace(/\D/g,'').replace(/^0+/,'');
    const idx=riders.findIndex(r=> String(r.phone||'').replace(/\D/g,'').replace(/^0+/,'')===cleanPhone);
    if(idx>-1) riders[idx]= {...riders[idx], balance:currentRider.balance, status:currentRider.status, name:riders[idx].name || currentRider.name};

    const content=btoa(unescape(encodeURIComponent(JSON.stringify(riders,null,2))));
    const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{
      method:'PUT',
      headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, content, sha:fileSha})
    });
    if(res.ok){
      const d=await res.json(); fileSha=d.content.sha;
      alert('تم الحفظ في جيثب ✓');
    } else if(res.status==401){
      localStorage.removeItem('gh_token');
      alert('التوكن منتهي - حط واحد جديد');
      openTokenModal();
    } else { throw 'fail'; }
  }catch(e){
    alert('تم الحفظ محليا فقط (جيثب فشل)');
  }
}

function openCharge(type){
  chargeType=type;
  document.getElementById('chargeTitle').innerText = type=='add'? 'إضافة رصيد للمندوب' : 'خصم رصيد من المندوب';
  document.getElementById('chargeBtn').innerText = type=='add'? 'شحن الآن' : 'خصم الآن';
  document.getElementById('chargeBtn').style.background = type=='add'? '#00a651' : '#ff3b30';
  document.getElementById('chargeModal').style.display='flex';
}
function doCharge(){
  let amt=parseFloat(document.getElementById('chargeAmount').value||0);
  if(!amt) return alert('اكتب المبلغ');
  if(chargeType=='add') currentRider.balance+=amt;
  else { currentRider.balance-=amt; if(currentRider.balance<0) currentRider.balance=0; }
  document.getElementById('chargeAmount').value='';
  document.getElementById('chargeModal').style.display='none';
  saveGitHub((chargeType=='add'?'شحن ':'خصم ')+amt+' لـ '+phone);
}
function updateStatus(newStatus){
  if(!confirm('تغير لـ '+newStatus+' ؟')) return;
  currentRider.status=newStatus;
  saveGitHub('حالة '+phone+' '+newStatus);
}
load();
</script>
</body>
    </html>
