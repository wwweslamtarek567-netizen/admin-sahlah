<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة المندوبين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:30px}
.header{background:#ff6a00;color:#fff;padding:15px 20px;border-radius:0 0 25px 25px;display:flex;justify-content:space-between;align-items:center}
.list-box{background:white;margin:15px 10px;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0 15px 0}
.rider-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer;transition:.1s}
.rider-row:active{transform:scale(.97);background:#fff8f0;border-color:#ff6a00}
.rider-row.deleting{opacity:.4}
.rider-row img{width:45px;height:45px;border-radius:50%}
.status{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.s-ok{background:#e8f5e9;color:#1b5e20}.s-road{background:#fff3e0;color:#e65100}.s-off{background:#ffebee;color:#b71c1c}.s-block{background:#000;color:white}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:340px;border-radius:20px;padding:22px;text-align:center}
.del-btn{width:48%;padding:13px;border:none;border-radius:12px;font-family:'Cairo';font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <button onclick="location.href='index.html'" style="background:rgba(0,0,0,.2);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px">‹</button>
  <div style="font-weight:900"><i class="fa-solid fa-users"></i> قائمة المندوبين <small id="src" style="font-size:10px"></small></div>
  <div></div>
</div>
<div class="list-box">
  <input id="search" class="search" placeholder="ابحث باسم المندوب أو رقم الهاتف... 🔍" onkeyup="render()">
  <div id="ridersList">جاري التحميل...</div>
  <div style="text-align:center;font-size:11px;color:#aaa;margin-top:10px">💡 دوسة طويلة على المندوب لحذفه - دوسة عادية لفتح البيانات</div>
</div>
<div class="modal" id="deleteModal">
  <div class="modal-box">
    <div style="width:60px;height:60px;background:#ffebee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><i class="fa-solid fa-trash" style="color:red;font-size:26px"></i></div>
    <h3 style="margin:0">حذف المندوب؟</h3>
    <div id="delInfo" style="margin:10px 0;font-size:14px;color:#555;line-height:1.7"></div>
    <div style="display:flex;gap:10px;margin-top:15px">
      <button class="del-btn" style="background:#eee;color:#333" onclick="closeDeleteModal()">إلغاء</button>
      <button class="del-btn" style="background:#d32f2f;color:white" onclick="confirmDelete()">نعم، احذف</button>
    </div>
  </div>
</div>
<script>
let allRiders=[]; let riderToDelete=null;
async function load(){
  try{
    document.getElementById('src').innerText='('+DB_URL.replace('https://','').split('.')[0]+')';
    const res=await fetch(DB_URL+'/riders.json?t='+Date.now()); const data=await res.json();
    if(!data) allRiders=[];
    else if(Array.isArray(data)) allRiders=data.map((r,i)=>({key:i,phone:String(r.phone||r.id).trim(),bal:parseFloat(r.balance)||0,delivered:parseInt(r.orders||0),status:r.status||'متاح',name:r.name||'مندوب',isArray:true})).filter(r=>r.phone);
    else allRiders=Object.keys(data).map(k=>({key:k,phone:String(data[k].phone||k).trim(),bal:parseFloat(data[k].balance)||0,delivered:parseInt(data[k].orders||0),status:data[k].status||'متاح',name:data[k].name||'مندوب',isArray:false}));
  }catch(e){document.getElementById('ridersList').innerHTML='<div style="text-align:center;padding:20px;color:red">فشل الاتصال</div>'; return}
  render();
}
function render(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  let filtered=allRiders.filter(r=>r.name.toLowerCase().includes(q)||r.phone.includes(q));
  if(filtered.length===0){document.getElementById('ridersList').innerHTML='<div style="text-align:center;padding:20px;color:#888">مفيش مناديب</div>'; return}
  document.getElementById('ridersList').innerHTML=filtered.map(r=>{
    let cls=r.status==='متاح'?'s-ok':r.status==='في الطريق'?'s-road':r.status==='محظور'?'s-block':'s-off';
    return `<div class="rider-row" data-phone="${r.phone}" data-key="${r.key}" data-name="${r.name}" onclick="openDetails('${r.phone}')" ontouchstart="startPress(this)" ontouchend="endPress()" ontouchmove="endPress()" onmousedown="startPress(this)" onmouseup="endPress()" onmouseleave="endPress()" oncontextmenu="return false;">
      <div style="display:flex;align-items:center;gap:12px"><i class="fa-solid fa-chevron-left" style="color:#ccc"></i><div class="status ${cls}">${r.status}</div><div style="text-align:center;min-width:45px"><b>${r.delivered}</b><br><small>طلب</small></div><div style="text-align:center;min-width:45px"><b>${r.bal}</b><br><small>جنيه</small></div></div>
      <div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div style="direction:ltr;font-size:13px;color:#555">${r.phone}</div><b>${r.name}</b></div><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=ff6a00&color=fff"></div>
    </div>`;
  }).join('');
}
function openDetails(phone){if(window.pressing) return; location.href='rider-details.html?phone='+phone;}
let pressTimer=null; window.pressing=false;
function startPress(el){window.pressing=false; clearTimeout(pressTimer); el.classList.add('deleting'); pressTimer=setTimeout(()=>{window.pressing=true; if(navigator.vibrate) navigator.vibrate(70); riderToDelete={phone:el.dataset.phone,key:el.dataset.key,name:el.dataset.name}; document.getElementById('delInfo').innerHTML=`<b>${riderToDelete.name}</b><br><span style="direction:ltr;display:inline-block">${riderToDelete.phone}</span>`; document.getElementById('deleteModal').classList.add('show'); el.classList.remove('deleting');},700);}
function endPress(){clearTimeout(pressTimer); document.querySelectorAll('.rider-row').forEach(x=>x.classList.remove('deleting')); setTimeout(()=>{window.pressing=false;},300);}
function closeDeleteModal(){document.getElementById('deleteModal').classList.remove('show'); riderToDelete=null;}
async function confirmDelete(){
  if(!riderToDelete) return;
  try{
    if(!isNaN(riderToDelete.key)){
      let res=await fetch(DB_URL+'/riders.json'); let data=await res.json();
      if(Array.isArray(data)){data=data.filter((x,i)=>String(i)!==String(riderToDelete.key)&&String(x.phone||'')!==riderToDelete.phone); await fetch(DB_URL+'/riders.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
      else{await fetch(DB_URL+'/riders/'+riderToDelete.key+'.json',{method:'DELETE'}); await fetch(DB_URL+'/riders/'+riderToDelete.phone+'.json',{method:'DELETE'});}
    }else{await fetch(DB_URL+'/riders/'+riderToDelete.key+'.json',{method:'DELETE'}); await fetch(DB_URL+'/riders/'+riderToDelete.phone+'.json',{method:'DELETE'});}
    allRiders=allRiders.filter(r=>String(r.phone)!==String(riderToDelete.phone)); render(); closeDeleteModal(); alert('✅ تم الحذف');
  }catch(e){alert('فشل الحذف: '+e.message);}
}
load();
</script>
</body>
                                                                                                                          </html>
