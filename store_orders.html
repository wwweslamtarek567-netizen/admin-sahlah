<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات متجر الطقم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
const DB_URL = "https://sahlah-c6152-default-rtdb.firebaseio.com";
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',sans-serif;background:#f4f4f4;padding:12px;padding-bottom:20px}
h2{margin:10px 6px 16px;font-weight:800}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0;background:#fff}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-weight:800;font-size:16px}
.amount{color:#ff6a00;font-weight:800;font-size:18px}
.phone{color:#555;font-size:13px;direction:ltr;text-align:right;margin-top:2px}
.date{color:#999;font-size:11px;margin:8px 0}
.badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.badge.wait{background:#fff3e0;color:#e65100}
.badge.pay{background:#e3f2fd;color:#0d47a1}
.badge.ok{background:#e8f5e9;color:#2e7d32}
.card img{width:100%;border-radius:12px;margin-top:10px;border:1px solid #eee;max-height:450px;object-fit:contain;cursor:pointer;display:block}
.no-img{background:#f9f9f9;color:#aaa;text-align:center;padding:20px;border-radius:12px;margin-top:10px;font-size:13px;border:1px dashed #ddd}
</style>
</head>
<body>

<h2>طلبات متجر الطقم <span id="count" style="font-size:12px;color:#888;font-weight:400"></span></h2>
<input id="search" class="search" placeholder="ابحث بالاسم أو رقم الهاتف..." onkeyup="render()">
<div id="list">⏳ تحميل...</div>

<script>
let allOrders=[];

async function load(){
  let res = await fetch(DB_URL + '/store_orders.json?t='+Date.now());
  let data = await res.json();
  if(!data){ allOrders=[]; render(); return; }
  allOrders = Object.keys(data).map(k=>({key:k,...data[k]})).reverse();
  render();
}

function render(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  let filtered=allOrders.filter(o=>(o.name||'').toLowerCase().includes(q) || (o.phone||'').includes(q));
  document.getElementById('count').innerText=`(${filtered.length})`;
  if(filtered.length==0){
    document.getElementById('list').innerHTML='<div style="text-align:center;padding:40px;color:#888">مفيش طلبات</div>';
    return;
  }
  let html='';
  for(let o of filtered){
    let screenshot = o.screenshot || o.image || '';
    let badge = 'wait';
    let statusText = 'جديد';
    if(o.status=='pending_payment'){ badge='pay'; statusText='بانتظار مراجعة الاسكرين 📷'; }
    if(o.status=='done'){ badge='ok'; statusText='تم ✅'; }
    if(screenshot && o.status!='done'){ badge='pay'; statusText='معه اسكرين - بانتظار مراجعة'; }

    html+=`
    <div class="card" onclick="openDetails('${o.key}')">
      <div class="top">
        <div>
          <div class="name">👤 ${o.name||'عميل'} - مقاس ${o.size||''} ${screenshot?'📷':''}</div>
          <div class="phone">${o.phone||''}</div>
        </div>
        <div class="amount">${o.price||0} جنيه</div>
      </div>
      <div class="date">🕒 ${o.date||''} - ${o.kit||''} - ${o.payMethod||''}</div>
      <div><span class="badge ${badge}">${statusText}</span></div>
      ${screenshot? `<img src="${screenshot}" onclick="event.stopPropagation(); window.open(this.src,'_blank')">` : `<div class="no-img">مفيش صورة مرفقة</div>`}
    </div>`;
  }
  document.getElementById('list').innerHTML=html;
}

function openDetails(key){
  let o=allOrders.find(x=>x.key==key);
  if(!o) return;
  if(!o.screenshot){ alert(`الاسم: ${o.name}\nالهاتف: ${o.phone}\nالمقاس: ${o.size}\nالطقم: ${o.kit}\nالسعر: ${o.price}\nالدفع: ${o.payMethod}`); return; }
  window.open(o.screenshot,'_blank');
}

load();
setInterval(load, 7000);
</script>
</body>
  </html>
