<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات متجر الطقم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:20px;user-select:none}
.header{background:#2E7D32;color:white;padding:15px 20px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;display:flex;justify-content:space-between;align-items:center}
.header a{color:white;text-decoration:none;font-size:22px}
.list-box{background:white;margin:15px 10px;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer;transition:.1s}
.order-row:active{transform:scale(.97)}
.order-row.deleting{opacity:.4}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.b-pending{background:#fff3e0;color:#e65100}.b-pay{background:#e3f2fd;color:#0d47a1}.b-done{background:#e8f5e9;color:#1b5e20}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;overflow-y:auto}
.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:400px;border-radius:20px;padding:20px;animation:pop.2s;max-height:90vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-family:'Cairo';font-weight:800;cursor:pointer;margin-top:8px}
.screen-box{margin-top:12px;border:2px dashed #ff6a00;border-radius:14px;padding:10px;text-align:center;background:#fffaf0}
.screen-box img{width:100%;border-radius:12px;cursor:pointer;max-height:320px;object-fit:contain;display:block}
</style>
</head>
<body>

<div class="header">
  <a href="index.html"><i class="fa-solid fa-arrow-right"></i></a>
  <div style="text-align:center"><div style="font-size:20px;font-weight:800">طلبات متجر الطقم</div><div style="font-size:12px;opacity:.9">إدارة طلبات التيشيرتات</div></div>
  <div style="width:22px"></div>
</div>

<div class="list-box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="margin:0"><i class="fa-solid fa-shirt" style="color:#2E7D32"></i> الطلبات <span id="count" style="font-size:12px;color:#888"></span></h3>
    <span style="font-size:11px;color:#aaa">دوسة طويلة للحذف</span>
  </div>
  <input id="search" class="search" placeholder="ابحث بالاسم أو رقم الهاتف..." onkeyup="render()">
  <div id="ordersList">جاري التحميل...</div>
</div>

<div class="modal" id="detailsModal" onclick="if(event.target==this) closeModal('detailsModal')">
  <div class="modal-box">
    <div style="text-align:center;margin-bottom:10px"><i class="fa-solid fa-shirt" style="font-size:40px;color:#2E7D32"></i></div>
    <h3 id="dName" style="margin:0;text-align:center"></h3>
    <div id="dInfo" style="margin-top:12px;line-height:2;font-size:14px;background:#f9f9f9;border-radius:12px;padding:12px"></div>

    <div id="screenBox" class="screen-box" style="display:none">
      <b style="font-size:13px"><i class="fa-solid fa-receipt"></i> سكرين الدفع</b>
      <div id="dPayMethod" style="font-size:12px;color:#666;margin:4px 0"></div>
      <img id="dScreenshot" onclick="window.open(this.src,'_blank')">
      <div style="margin-top:8px"><a id="dScreenshotLink" href="#" target="_blank" style="font-size:12px;color:#ff6a00;font-weight:800">فتح الصورة بحجم كامل</a></div>
      <div id="dNoImg" style="display:none;color:#aaa;font-size:12px;padding:10px">مفيش صورة مرفقة</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn" style="background:#eee" onclick="closeModal('detailsModal')">إغلاق</button>
      <button class="btn" id="confirmBtn" style="background:#2E7D32;color:white" onclick="confirmOrder()">تأكيد التسليم ✅</button>
    </div>
  </div>
</div>

<div class="modal" id="deleteModal">
  <div class="modal-box" style="text-align:center">
    <div style="width:60px;height:60px;background:#ffebee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><i class="fa-solid fa-trash" style="color:red;font-size:26px"></i></div>
    <h3>حذف الطلب؟</h3>
    <div id="delInfo" style="font-size:14px;color:#555;margin:8px 0"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="background:#eee;flex:1" onclick="closeModal('deleteModal')">إلغاء</button>
      <button class="btn" style="background:#d32f2f;color:white;flex:1" onclick="doDelete()">حذف</button>
    </div>
  </div>
</div>

<script>
let allOrders = [];
let selectedKey = null;
let deleteKey = null;
let pressTimer = null;

function getScreenshot(o){
  return o.screenshot || o.image || o.screen || o.screenshotUrl || o.img || "";
}

async function load(){
  try{
    let res = await fetch(DB_URL + '/store_orders.json?t='+Date.now());
    let data = await res.json();
    if(!data) allOrders = [];
    else allOrders = Object.keys(data).map(k=>({key:k,...data[k]})).reverse();
    render();
  }catch(e){
    document.getElementById('ordersList').innerHTML = '<div style="text-align:center;color:red">فشل التحميل<br>'+e.message+'</div>';
  }
}

function getBadge(o){
  let sc = getScreenshot(o);
  if(o.status=='done' || o.status=='confirmed') return '<span class="badge b-done">تم</span>';
  if(o.status=='pending_payment') return '<span class="badge b-pay">بانتظار مراجعة الاسكرين 📷</span>';
  if(sc) return '<span class="badge b-pay">معه اسكرين 📷</span>';
  return '<span class="badge b-pending">جديد</span>';
}

function render(){
  let q = document.getElementById('search').value.toLowerCase().trim();
  let filtered = allOrders.filter(o => (o.name||'').toLowerCase().includes(q) || (o.phone||'').includes(q) || (o.size||'').toLowerCase().includes(q));
  document.getElementById('count').innerText = `(${filtered.length})`;
  if(filtered.length==0){
    document.getElementById('ordersList').innerHTML = '<div style="text-align:center;padding:20px;color:#888">مفيش طلبات</div>';
    return;
  }
  document.getElementById('ordersList').innerHTML = filtered.map(o=>{
    let sc = getScreenshot(o);
    let hasScreen = sc? '<i class="fa-solid fa-image" style="color:#ff6a00;margin-right:4px"></i>' : '';
    return `
    <div class="order-row" data-key="${o.key}"
      onclick="openDetails('${o.key}')"
      ontouchstart="startPress(this)" ontouchend="endPress()" ontouchmove="endPress()"
      onmousedown="startPress(this)" onmouseup="endPress()" onmouseleave="endPress()"
      oncontextmenu="return false"
    >
      <div style="display:flex;align-items:center;gap:10px">
        <div style="background:#E8F5E9;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-shirt" style="color:#2E7D32"></i></div>
        <div>
          <div style="font-weight:800">${o.name||'عميل'} ${hasScreen} <small style="font-weight:400;color:#888">- ${o.size||''}</small></div>
          <div style="font-size:12px;color:#666;direction:ltr;text-align:right">${o.phone||''} • ${o.kit||''} • ${o.price||''}ج</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${getBadge(o)}
        <i class="fa-solid fa-chevron-left" style="color:#ccc"></i>
      </div>
    </div>`;
  }).join('');
}

function openDetails(key){
  if(window.longPress) return;
  let o = allOrders.find(x=>x.key==key);
  if(!o) return;
  selectedKey = key;
  let sc = getScreenshot(o);
  document.getElementById('dName').innerText = o.name || 'طلب';
  document.getElementById('dInfo').innerHTML = `
    <div><b>📞 الهاتف:</b> <span style="direction:ltr;display:inline-block">${o.phone||'-'}</span></div>
    <div><b>📏 المقاس:</b> ${o.size||'-'}</div>
    <div><b>👕 الطقم:</b> ${o.kit||'-'}</div>
    <div><b>🎨 اللون:</b> ${o.color||'برتقالي'}</div>
    <div><b>🔢 الكمية:</b> ${o.qty||1}</div>
    <div><b>📍 العنوان:</b> ${o.address||o.city||'-'}</div>
    <div><b>💰 السعر:</b> ${o.price||'-'} جنيه</div>
    <div><b>💳 طريقة الدفع:</b> ${o.payMethod||'لم يختار بعد'} ${o.payNumber?'- '+o.payNumber:''}</div>
    <div><b>⏰ التاريخ:</b> ${o.date||'-'}</div>
    <div><b>الحالة:</b> ${o.status||'pending'}</div>
  `;

  let box = document.getElementById('screenBox');
  box.style.display='block';
  let img = document.getElementById('dScreenshot');
  let link = document.getElementById('dScreenshotLink');
  let noImg = document.getElementById('dNoImg');

  if(sc){
    img.style.display='block';
    link.style.display='inline';
    noImg.style.display='none';
    img.src = sc;
    link.href = sc;
    document.getElementById('dPayMethod').innerText = o.payMethod=='vodafone'? 'فودافون كاش 01040791442' : o.payMethod=='instapay'? 'انستا باي 01023284996' : (o.payMethod||'');
    img.onerror = ()=>{ img.style.display='none'; noImg.style.display='block'; noImg.innerText='فشل تحميل الصورة - الرابط: '+sc.substring(0,60); };
  }else{
    img.style.display='none';
    link.style.display='none';
    document.getElementById('dPayMethod').innerText = 'مفيش اسكرين مرفوع';
    noImg.style.display='block';
    noImg.innerText='مفيش صورة مرفقة - العميل لسه مرفعش الاسكرين';
  }

  document.getElementById('detailsModal').classList.add('show');
  let btn=document.getElementById('confirmBtn');
  if(o.status=='done'){ btn.innerText='تم تأكيده ✔️'; btn.disabled=true; btn.style.background='#aaa'; }
  else { btn.innerText='تأكيد التسليم ✅'; btn.disabled=false; btn.style.background='#2E7D32'; }
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }

async function confirmOrder(){
  if(!selectedKey) return;
  try{
    await fetch(DB_URL + '/store_orders/' + selectedKey + '.json', {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status:'done', confirmedAt: new Date().toISOString()})
    });
    let o = allOrders.find(x=>x.key==selectedKey);
    if(o) o.status='done';
    render();
    closeModal('detailsModal');
    alert('✅ تم تأكيد الطلب');
  }catch(e){ alert('خطأ: '+e.message); }
}

function startPress(el){
  window.longPress = false;
  clearTimeout(pressTimer);
  el.classList.add('deleting');
  pressTimer = setTimeout(()=>{
    window.longPress = true;
    if(navigator.vibrate) navigator.vibrate(70);
    deleteKey = el.dataset.key;
    let o = allOrders.find(x=>x.key==deleteKey);
    document.getElementById('delInfo').innerHTML = `<b>${o?.name||''}</b><br>${o?.phone||''} - مقاس ${o?.size||''}`;
    document.getElementById('deleteModal').classList.add('show');
    el.classList.remove('deleting');
  }, 700);
}
function endPress(){
  clearTimeout(pressTimer);
  document.querySelectorAll('.order-row').forEach(x=>x.classList.remove('deleting'));
  setTimeout(()=>window.longPress=false, 300);
}
async function doDelete(){
  if(!deleteKey) return;
  try{
    await fetch(DB_URL + '/store_orders/' + deleteKey + '.json', {method:'DELETE'});
    allOrders = allOrders.filter(x=>x.key!=deleteKey);
    render();
    closeModal('deleteModal');
  }catch(e){ alert(e.message); }
}

load();
</script>
</body>
  </html>
