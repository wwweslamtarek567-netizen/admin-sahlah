<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:90px;user-select:none}
.header{background:#ff6a00;color:white;padding:15px 20px 25px 20px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.c{border-radius:18px;padding:15px;text-align:center}
.c i{font-size:32px;margin-bottom:8px;display:block}
.c.num{font-size:24px;font-weight:800}
.c.lbl{font-size:13px;font-weight:700;color:#555}
.c-green{background:#e8f5e9}.c-blue{background:#e3f2fd}.c-orange{background:#fff3e0}.c-purple{background:#f3e5f5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav div{text-align:center;color:#888;font-size:12px;cursor:pointer;flex:1}
.bottom-nav div.active{color:#ff6a00;font-weight:800}
.bottom-nav i{font-size:22px;display:block;margin-bottom:3px}
.switch{position:relative;display:inline-block;width:50px;height:28px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:20px;transition:.3s}
.slider:before{position:absolute;content:"";height:20px;width:20px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.3s}
input:checked +.slider{background:#2E7D32}
input:checked +.slider:before{transform:translateX(22px)}
.main-btn{flex:1;padding:18px;border:none;border-radius:18px;font-family:'Cairo';font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.main-btn:active{transform:scale(.96)}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;gap:12px;align-items:center">
    <i class="fa-solid fa-bell" style="font-size:26px;cursor:pointer"></i>
  </div>
  <div style="text-align:center"><div style="font-size:28px;font-weight:800">سهلة للتوصيل</div><div style="background:#a13c00;border-radius:20px;padding:4px 20px;margin-top:8px;font-size:14px">لوحة التحكم</div></div>
  <div><img src="https://ui-avatars.com/api/?name=Admin&background=fff&color=ff6a00" style="width:45px;height:45px;border-radius:50%"></div>
</div>

<div class="cards">
  <div class="c c-green"><i class="fa-solid fa-coins" style="color:#00a651"></i><div class="num" id="totalBalance">0</div><div class="lbl">جنيه<br>إجمالي الأرصدة</div></div>
  <div class="c c-blue"><i class="fa-solid fa-clipboard-check" style="color:#007aff"></i><div class="num" id="totalOrders">0</div><div class="lbl">طلب<br>إجمالي الطلبات</div></div>
  <div class="c c-orange"><i class="fa-solid fa-user" style="color:#ff6a00"></i><div class="num" id="totalRiders">0</div><div class="lbl">مندوب<br>إجمالي المندوبين</div></div>
  <div class="c c-purple"><i class="fa-solid fa-user-group" style="color:#007aff"></i><div class="num" id="totalClients">0</div><div class="lbl">عميل<br>إجمالي العملاء</div></div>
</div>

<div style="padding:0 15px;margin-bottom:12px">
  <a href="recharge_requests.html" style="text-decoration:none">
    <div style="background:white;border-radius:18px;padding:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);border-right:5px solid #ff6a00">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="background:#fff3e0;width:45px;height:45px;border-radius:12px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-money-bill-transfer" style="color:#ff6a00;font-size:22px"></i></div>
        <div>
          <div style="font-weight:800;color:#333">طلبات الشحن - فودافون كاش</div>
          <div style="font-size:12px;color:#888">شوف صور التحويلات وأكد الرصيد - دوسة طويلة للحذف</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="rechargeCount" style="background:red;color:white;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;display:none">0 جديد</span>
        <i class="fa-solid fa-chevron-left" style="color:#ccc"></i>
      </div>
    </div>
  </a>
</div>

<div style="padding:0 15px;margin-bottom:15px">
  <div style="background:white;border-radius:18px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-right:5px solid #2E7D32">
    <a href="store_orders.html" style="text-decoration:none;color:inherit;display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="background:#E8F5E9;width:45px;height:45px;border-radius:12px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-shirt" style="color:#2E7D32;font-size:22px"></i></div>
        <div>
          <div style="font-weight:800;color:#333">طلبات متجر الطقم</div>
          <div style="font-size:12px;color:#888">شوف طلبات التيشيرتات والمقاسات</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="storeCount" style="background:red;color:white;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;display:none">0 جديد</span>
        <i class="fa-solid fa-chevron-left" style="color:#ccc"></i>
      </div>
    </a>
    <div style="margin-top:12px; background:#f8fdf8; border:1.5px solid #c8e6c9; border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex;align-items:center;gap:8px">
        <i class="fa-solid fa-power-off" style="color:#2E7D32"></i>
        <span id="storeStatusText" style="font-weight:800; font-size:13px; color:#2E7D32">● المتجر مفتوح</span>
      </div>
      <label class="switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="storeToggle" onchange="toggleStore()">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<!-- التعديل الوحيد هنا - زرارين بيحولوا لصفحات تانية -->
<div style="padding:0 15px; display:flex; gap:10px; margin-bottom:15px;">
  <a href="mandobeen.html" style="flex:1;text-decoration:none">
    <button class="main-btn" style="background:#ff6a00;color:#fff;"><i class="fa-solid fa-users"></i> فتح قائمة المندوبين</button>
  </a>
  <a href="clients.html" style="flex:1;text-decoration:none">
    <button class="main-btn" style="background:#007aff;color:#fff;"><i class="fa-solid fa-user-group"></i> فتح قائمة العملاء</button>
  </a>
</div>

<div class="bottom-nav">
  <div onclick="location.href='recharge_requests.html'"><i class="fa-solid fa-money-bill-transfer"></i> الشحن <span id="navCount" style="display:none;background:red;color:white;border-radius:10px;padding:0 5px;font-size:10px">!</span></div>
  <div><i class="fa-solid fa-users"></i> المندوبين</div>
  <div class="active"><i class="fa-solid fa-house"></i> الرئيسية</div>
</div>

<script>
const STORE_SETTINGS_URL = DB_URL + '/settings/uniformStore.json';
async function loadStoreStatus(){
  try{
    let res = await fetch(STORE_SETTINGS_URL + '?t=' + Date.now());
    let data = await res.json();
    let isOpen = data?.isOpen?? true;
    document.getElementById('storeToggle').checked = isOpen;
    document.getElementById('storeStatusText').innerText = isOpen? '● المتجر مفتوح' : '○ المتجر مغلق';
    document.getElementById('storeStatusText').style.color = isOpen? '#2E7D32' : '#999';
  }catch(e){}
}
async function toggleStore(){
  let isOpen = document.getElementById('storeToggle').checked;
  document.getElementById('storeStatusText').innerText = isOpen? '● المتجر مفتوح' : '○ المتجر مغلق';
  document.getElementById('storeStatusText').style.color = isOpen? '#2E7D32' : '#999';
  await fetch(STORE_SETTINGS_URL, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({isOpen: isOpen, updatedAt: Date.now()})});
}
async function load(){
  try{
    const res = await fetch(DB_URL + '/riders.json?t=' + Date.now());
    const data = await res.json();
    let allRiders=[];
    if(!data) allRiders=[];
    else if(Array.isArray(data)) allRiders=data.map(r=>({bal:parseFloat(r.balance)||0, delivered:parseInt(r.orders||0)})).filter(r=>r);
    else allRiders=Object.values(data).map(r=>({bal:parseFloat(r.balance)||0, delivered:parseInt(r.orders||0)}));
    let totalBal=0,totalOrders=0;
    allRiders.forEach(r=>{totalBal+=r.bal; totalOrders+=r.delivered});
    document.getElementById('totalBalance').innerText=totalBal;
    document.getElementById('totalOrders').innerText=totalOrders;
    document.getElementById('totalRiders').innerText=allRiders.length;
  }catch(e){}
}
async function loadClients(){
  try{
    const res = await fetch(DB_URL + '/clients.json?t=' + Date.now());
    const data = await res.json();
    let count=0;
    if(!data) count=0;
    else if(Array.isArray(data)) count=data.filter(c=>c).length;
    else count=Object.keys(data).length;
    document.getElementById('totalClients').innerText=count;
  }catch(e){}
}
async function checkRecharge(){
  try{
    let res = await fetch(DB_URL + '/recharge_requests.json');
    let data = await res.json();
    if(!data) return;
    let pending = Object.values(data).filter(r=>!r.status || r.status==='pending').length;
    if(pending>0){
      document.getElementById('rechargeCount').style.display='inline-block';
      document.getElementById('rechargeCount').innerText = pending + ' جديد';
      document.getElementById('navCount').style.display='inline-block';
    } else {
      document.getElementById('rechargeCount').style.display='none';
      document.getElementById('navCount').style.display='none';
    }
  }catch(e){}
}
async function checkStore(){
  try{
    let res = await fetch(DB_URL + '/store_orders.json');
    let data = await res.json();
    if(!data) return;
    let pending = Object.values(data).filter(r=>!r.status || r.status==='pending').length;
    if(pending>0){
      document.getElementById('storeCount').style.display='inline-block';
      document.getElementById('storeCount').innerText = pending + ' جديد';
    } else {
      document.getElementById('storeCount').style.display='none';
    }
  }catch(e){}
}
load();
loadClients();
loadStoreStatus();
checkRecharge();
checkStore();
setInterval(checkRecharge, 5000);
setInterval(checkStore, 5000);
</script>
</body>
  </html>
