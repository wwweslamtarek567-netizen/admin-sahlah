<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:90px}
.header{background:#ff6a00;color:white;padding:15px 20px 25px 20px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.c{border-radius:18px;padding:15px;text-align:center}
.c i{font-size:32px;margin-bottom:8px;display:block}
.c .num{font-size:24px;font-weight:800}
.c .lbl{font-size:13px;font-weight:700;color:#555}
.c-green{background:#e8f5e9}.c-blue{background:#e3f2fd}.c-orange{background:#fff3e0}.c-purple{background:#f3e5f5}
.list-box{background:white;margin:0 10px;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0 15px 0}
.rider-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer}
.rider-row .right{display:flex;align-items:center;gap:10px}
.rider-row img{width:45px;height:45px;border-radius:50%}
.status{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.s-ok{background:#e8f5e9;color:#1b5e20}.s-road{background:#fff3e0;color:#e65100}.s-off{background:#ffebee;color:#b71c1c}.s-block{background:#000;color:white}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav div{text-align:center;color:#888;font-size:12px;cursor:pointer}
.bottom-nav div.active{color:#ff6a00;font-weight:800}
.bottom-nav i{font-size:22px;display:block;margin-bottom:3px}
/* مودال التوكن - الجديد */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal.show{display:flex}
.modal-box{background:white;width:100%;max-width:360px;border-radius:18px;padding:20px}
.modal-box input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;direction:ltr;margin:10px 0;font-family:'Cairo'}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;gap:12px;align-items:center">
    <i class="fa-solid fa-bell" style="font-size:26px;cursor:pointer"></i>
    <i class="fa-solid fa-gear" style="font-size:24px;cursor:pointer;background:rgba(0,0,0,.15);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%" onclick="openTokenModal()" title="تغيير التوكن"></i>
  </div>
  <div style="text-align:center"><div style="font-size:28px;font-weight:800">سهلة للتوصيل</div><div style="background:#a13c00;border-radius:20px;padding:4px 20px;margin-top:8px;font-size:14px">لوحة التحكم</div></div>
  <div><img src="https://ui-avatars.com/api/?name=Admin&background=fff&color=ff6a00" style="width:45px;height:45px;border-radius:50%"></div>
</div>

<div class="cards">
  <div class="c c-green"><i class="fa-solid fa-coins" style="color:#00a651"></i><div class="num" id="totalBalance">0</div><div class="lbl">جنيه<br>إجمالي الأرصدة</div></div>
  <div class="c c-blue"><i class="fa-solid fa-clipboard-check" style="color:#007aff"></i><div class="num" id="totalOrders">0</div><div class="lbl">طلب<br>إجمالي الطلبات</div></div>
  <div class="c c-orange"><i class="fa-solid fa-user" style="color:#ff6a00"></i><div class="num" id="totalRiders">0</div><div class="lbl">مندوب<br>إجمالي المندوبين</div></div>
  <div class="c c-purple"><i class="fa-solid fa-wallet" style="color:#9c27b0"></i><div class="num" id="todayProfit">0</div><div class="lbl">جنيه<br>أرباح اليوم</div></div>
</div>

<div class="list-box">
  <h3 style="margin:0;display:flex;align-items:center;gap:8px"><i class="fa-solid fa-users" style="color:#ff6a00"></i> قائمة المندوبين <small id="src" style="font-size:10px;color:#888"></small></h3>
  <input id="search" class="search" placeholder="ابحث باسم المندوب أو رقم الهاتف ... 🔍" onkeyup="render()">
  <div id="ridersList">جاري التحميل...</div>
</div>

<div class="bottom-nav">
  <div onclick="openTokenModal()"><i class="fa-solid fa-gear"></i> الإعدادات</div>
  <div><i class="fa-solid fa-clipboard"></i> الطلبات</div>
  <div><i class="fa-solid fa-users"></i> المندوبين</div>
  <div class="active"><i class="fa-solid fa-house"></i> الرئيسية</div>
</div>

<!-- مودال التوكن الجديد -->
<div class="modal" id="tokenModal">
  <div class="modal-box">
    <h3 style="margin:0 0 5px 0">⚙️ تغيير التوكن</h3>
    <p style="font-size:12px;color:#666;margin:0">حط التوكن الجديد هنا (بيتخزن في جهازك بس)</p>
    <input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx">
    <button onclick="saveToken()" style="width:100%;padding:12px;background:#ff6a00;color:white;border:none;border-radius:12px;font-family:'Cairo';font-weight:800;cursor:pointer">حفظ التوكن</button>
    <button onclick="closeTokenModal()" style="width:100%;padding:12px;background:#eee;border:none;border-radius:12px;margin-top:8px;font-family:'Cairo';font-weight:700;cursor:pointer">اغلاق</button>
    <div id="tokenStatus" style="font-size:11px;margin-top:8px;text-align:center;color:#0ab04a"></div>
  </div>
</div>

<script>
let allRiders=[];

function getToken(){ return localStorage.getItem('gh_token') || localStorage.getItem('github_token') || ""; }
function openTokenModal(){
  document.getElementById('tokenInput').value=getToken();
  document.getElementById('tokenStatus').innerText=getToken()?'التوكن محفوظ ✓':'مفيش توكن محفوظ';
  document.getElementById('tokenModal').classList.add('show');
}
function closeTokenModal(){ document.getElementById('tokenModal').classList.remove('show'); }
function saveToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t) return alert('اكتب التوكن');
  localStorage.setItem('gh_token',t);
  localStorage.setItem('github_token',t);
  document.getElementById('tokenStatus').innerText='تم الحفظ ✓ - اعمل ريفريش';
  setTimeout(closeTokenModal,700);
}

async function load(){
  let fromGithub = false;
  try{
    const res = await fetch('https://raw.githubusercontent.com/wwweslamtarek567-netizen/sahlah/main/riders.json?t='+Date.now());
    if(res.ok){
      const data = await res.json();
      if(Array.isArray(data) && data.length>0){
        allRiders = data.map(r=>({
          phone: String(r.phone).trim(),
          bal: parseFloat(r.balance)||0,
          delivered: r.orders||0,
          status: r.status||'متاح',
          name: r.name||'مندوب'
        }));
        fromGithub = true;
        document.getElementById('src').innerText='(GitHub ✓)';
      }
    }
  }catch(e){}

  if(!fromGithub){
    allRiders=[];
    for(let i=0;i<localStorage.length;i++){
      let k=localStorage.key(i);
      if(k.startsWith('balance_')){
        let phone=k.replace('balance_','');
        let bal=parseFloat(localStorage.getItem(k)||0);
        let orders = parseInt(localStorage.getItem('orders_'+phone)||0);
        let hist = JSON.parse(localStorage.getItem('history_'+phone)||'[]');
        if(hist.length>0) orders = hist.filter(h=>h.type==='minus').length;
        let status = localStorage.getItem('status_'+phone)||'متاح';
        let name = localStorage.getItem('name_'+phone)||'مندوب '+phone.slice(-4);
        allRiders.push({phone, bal, delivered: orders, status, name});
      }
    }
    document.getElementById('src').innerText='(localStorage)';
  }
  render();
}

function render(){
  let q=document.getElementById('search').value.toLowerCase().trim();
  let filtered = allRiders.filter(r=> r.name.toLowerCase().includes(q) || r.phone.includes(q));
  
  let totalBal=0, totalOrders=0;
  filtered.forEach(r=>{totalBal+=r.bal; totalOrders+=r.delivered});

  document.getElementById('totalBalance').innerText = totalBal;
  document.getElementById('totalOrders').innerText = totalOrders;
  document.getElementById('totalRiders').innerText = filtered.length;
  document.getElementById('todayProfit').innerText = totalOrders * 6;

  if(filtered.length===0){
    document.getElementById('ridersList').innerHTML = '<div style="text-align:center;padding:20px;color:#888">مفيش مناديب - ضيف من riders.json</div>';
    return;
  }

  document.getElementById('ridersList').innerHTML = filtered.map(r=>{
    let cls = r.status==='متاح'?'s-ok':r.status==='في الطريق'?'s-road':r.status==='محظور'?'s-block':'s-off';
    return `
    <div class="rider-row" onclick="location.href='rider-details.html?phone=${r.phone}'">
      <div style="display:flex;align-items:center;gap:12px">
        <i class="fa-solid fa-chevron-left" style="color:#ccc"></i>
        <div class="status ${cls}">${r.status}</div>
        <div style="text-align:center;min-width:45px"><b>${r.delivered}</b><br><small>طلب</small></div>
        <div style="text-align:center;min-width:45px"><b>${r.bal}</b><br><small>جنيه</small></div>
      </div>
      <div class="right">
        <div style="text-align:right">
          <div style="direction:ltr;font-size:13px;color:#555">${r.phone}</div>
          <b>${r.name}</b>
        </div>
        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=ff6a00&color=fff">
      </div>
    </div>`;
  }).join('');
}

load();
</script>
</body>
  </html>
