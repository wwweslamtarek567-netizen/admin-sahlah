<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:90px}
.header{background:#ff6a00;color:white;padding:15px 20px 25px 20px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;display:flex;justify-content:space-between;align-items:center}
.badge{position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.c{border-radius:18px;padding:15px;text-align:center}.c i{font-size:32px;margin-bottom:8px;display:block}.c .num{font-size:24px;font-weight:800}.c .lbl{font-size:13px;font-weight:700;color:#555}
.c-green{background:#e8f5e9}.c-blue{background:#e3f2fd}.c-orange{background:#fff3e0}.c-purple{background:#f3e5f5}
.list-box{background:white;margin:0 10px;border-radius:20px;padding:15px}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0 15px 0}
.rider-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer}
.rider-row .right{display:flex;align-items:center;gap:10px}.rider-row img{width:45px;height:45px;border-radius:50%}
.status{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.s-ok{background:#e8f5e9;color:#1b5e20}.s-road{background:#fff3e0;color:#e65100}.s-off{background:#ffebee;color:#b71c1c}.s-block{background:#000;color:white}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav div{text-align:center;color:#888;font-size:12px}.bottom-nav div.active{color:#ff6a00;font-weight:800}.bottom-nav i{font-size:22px;display:block;margin-bottom:3px}
</style>
</head>
<body>
<div class="header">
  <div style="position:relative"><i class="fa-solid fa-bell" style="font-size:26px"></i><div class="badge">3</div></div>
  <div style="text-align:center"><div style="font-size:28px;font-weight:800">سهلة للتوصيل</div><div style="background:#a13c00;border-radius:20px;padding:4px 20px;margin-top:8px;font-size:14px">لوحة التحكم</div></div>
  <div><img src="https://ui-avatars.com/api/?name=Admin&background=fff&color=ff6a00" style="width:45px;height:45px;border-radius:50%"></div>
</div>
<div class="cards">
  <div class="c c-green"><i class="fa-solid fa-coins" style="color:#00a651"></i><div class="num" id="totalBalance">--</div><div class="lbl">جنيه<br>إجمالي الأرصدة</div></div>
  <div class="c c-blue"><i class="fa-solid fa-clipboard-check" style="color:#007aff"></i><div class="num" id="totalOrders">--</div><div class="lbl">طلب<br>إجمالي الطلبات</div></div>
  <div class="c c-orange"><i class="fa-solid fa-user" style="color:#ff6a00"></i><div class="num" id="totalRiders">--</div><div class="lbl">مندوب<br>إجمالي المندوبين</div></div>
  <div class="c c-purple"><i class="fa-solid fa-wallet" style="color:#9c27b0"></i><div class="num" id="todayProfit">--</div><div class="lbl">جنيه<br>أرباح اليوم</div></div>
</div>
<div class="list-box">
  <h3 style="margin:0"><i class="fa-solid fa-users" style="color:#ff6a00"></i> قائمة المندوبين <small id="src" style="font-size:10px;color:#888"></small></h3>
  <input id="search" class="search" placeholder="ابحث باسم المندوب أو رقم الهاتف ... 🔍" onkeyup="render()">
  <div id="ridersList">جاري التحميل...</div>
</div>
<div class="bottom-nav">
  <div><i class="fa-solid fa-gear"></i> الإعدادات</div><div><i class="fa-solid fa-clipboard"></i> الطلبات</div><div><i class="fa-solid fa-users"></i> المندوبين</div><div class="active"><i class="fa-solid fa-house"></i> الرئيسية</div>
</div>
<script>
let allRiders=[];
async function load(){
 try{
  const res = await fetch('https://raw.githubusercontent.com/wwweslamtarek567-netizen/sahlah/main/riders.json?t='+Date.now());
  if(!res.ok) throw new Error('404');
  const data = await res.json();
  allRiders = data.map(r=>({
    phone: String(r.phone).trim(),
    bal: parseFloat(r.balance)||0,
    delivered: r.orders||0,
    status: r.status||'متاح',
    name: r.name||'مندوب'
  }));
  document.getElementById('src').innerText='(GitHub ✓)';
  render();
 }catch(e){
  document.getElementById('ridersList').innerHTML = '<div style="color:red">مش لاقي riders.json<br>تأكد انه في main بره<br>'+e.message+'</div>';
 }
}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let f=allRiders.filter(r=>r.name.toLowerCase().includes(q)||r.phone.includes(q));
 let tb=0,to=0; f.forEach(r=>{tb+=r.bal; to+=r.delivered});
 document.getElementById('totalBalance').innerText=tb;
 document.getElementById('totalOrders').innerText=to;
 document.getElementById('totalRiders').innerText=f.length;
 document.getElementById('todayProfit').innerText=to*6;
 document.getElementById('ridersList').innerHTML=f.map(r=>{
   let cls=r.status=='متاح'?'s-ok':r.status=='في الطريق'?'s-road':r.status=='محظور'?'s-block':'s-off';
   return `<div class="rider-row" onclick="location.href='rider-details.html?phone=${r.phone}'"><div style="display:flex;align-items:center;gap:10px"><i class="fa-solid fa-chevron-left"></i><div class="status ${cls}">${r.status}</div><div style="text-align:center"><b>${r.delivered}</b><br><small>طلب</small></div><div style="text-align:center"><b>${r.bal}</b><br><small>جنيه</small></div></div><div class="right"><div style="text-align:right"><div style="direction:ltr">${r.phone}</div><b>${r.name}</b></div><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=ff6a00&color=fff"></div></div>`;
 }).join('') || 'مفيش مناديب';
}
load();
</script>
</body>
                                                                                                 </html>
