<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة - لوحة التحكم</title>
<style>
*{font-family:system-ui,Tajawal,sans-serif;box-sizing:border-box}
body{margin:0;background:#f7f7f7;padding-bottom:80px}
.top{background:#ff6a00;color:#fff;padding:20px 15px;border-radius:0 0 30px 30px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.box{padding:18px;border-radius:20px;text-align:center;background:#fff}
.box b{font-size:30px;display:block}
.list{background:#fff;margin:15px;border-radius:20px;padding:15px}
.rider{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:14px 0}
.rider b{font-size:16px}
.btn{border:none;padding:8px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
.btn-add{background:#0a9d4e;color:#fff} .btn-sub{background:#e30613;color:#fff}
input.search{width:100%;padding:12px;border-radius:30px;border:1px solid #ddd;text-align:center;margin-bottom:10px}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="top">
<div>👤 مدير سهلة<br><small>01025025973</small></div>
<div style="text-align:center"><h2 style="margin:0">سهلة<br><small style="font-weight:normal">للتوصيل</small></h2><small>لوحة التحكم</small></div>
<div>🔔</div>
</div>

<div class="grid">
<div class="box"><b id="totalBalance">--</b><p>اجمالي الأرصدة</p></div>
<div class="box"><b id="totalRiders">--</b><p>المندوبين</p></div>
</div>

<div class="list">
<h3>👥 قائمة المندوبين (من GitHub)</h3>
<input class="search" id="search" placeholder="🔍 ابحث...">
<div id="ridersList">جاري التحميل من sahlah/riders.json ...</div>
<hr>
<input id="amount" type="number" placeholder="اكتب المبلغ 100 مثلا" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd">
<p style="font-size:12px;color:#888">التوكن محفوظ في جهازك فقط. لو عايز تغيره دوس هنا <a href="#" onclick="localStorage.removeItem('gh_token');location.reload()">مسح التوكن</a></p>
</div>

<div class="nav"><div style="color:#ff6a00">🏠<br>الرئيسية</div><div>👥<br>المندوبين</div><div>📋<br>الطلبات</div><div>⚙️<br>الإعدادات</div></div>

<script>
const OWNER="wwweslamtarek567-netizen";
const REPO="sahlah";
const FILE_PATH="riders.json";
let riders=[], fileSha="";

async function getToken(){
 let t=localStorage.getItem('gh_token');
 if(!t){
   t=prompt('الصق توكن GitHub هنا (مرة واحدة بس):');
   if(t){ localStorage.setItem('gh_token',t.trim()); return t.trim(); }
   else throw "مفيش توكن";
 }
 return t;
}

async function load(){
 try{
  const token=await getToken();
  const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?t=${Date.now()}`,{
    headers:{Authorization:`Bearer ${token}`}
  });
  if(res.status===404){ document.getElementById('ridersList').innerHTML='ملف riders.json مش موجود في مستودع sahlah - اعمله الأول'; return; }
  const data=await res.json();
  fileSha=data.sha;
  riders=JSON.parse(decodeURIComponent(escape(atob(data.content))));
  render();
 }catch(e){ document.getElementById('ridersList').innerHTML='خطأ: '+e; }
}

function render(){
 let total=riders.reduce((s,r)=>s+(r.balance||0),0);
 document.getElementById('totalBalance').innerText=total+" جنيه";
 document.getElementById('totalRiders').innerText=riders.length;
 let html='';
 riders.forEach((r,i)=>{
  html+=`<div class=rider><div><b>${r.name}</b><br><small>${r.phone} - رصيد ${r.balance} ج - ${r.orders} طلب</small></div><div><button class=btn btn-add onclick="changeBalance(${i},1)">+ رصيد</button> <button class=btn btn-sub onclick="changeBalance(${i},-1)">- خصم</button></div></div>`;
 });
 document.getElementById('ridersList').innerHTML=html;
}

async function changeBalance(index, type){
 const token=await getToken();
 const amount=parseInt(document.getElementById('amount').value);
 if(!amount) return alert('اكتب المبلغ الأول');
 let val = type===1 ? amount : -amount;
 riders[index].balance+=val;
 if(riders[index].balance<0) riders[index].balance=0;
 const newContent=btoa(unescape(encodeURIComponent(JSON.stringify(riders,null,2))));
 const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{
   method:'PUT',
   headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
   body:JSON.stringify({message:`تحديث رصيد ${riders[index].name} ${val} جنيه`,content:newContent,sha:fileSha})
 });
 if(res.ok){
  const d=await res.json();
  fileSha=d.content.sha;
  alert(`تم! رصيد ${riders[index].name} بقى ${riders[index].balance} جنيه - هيظهر في موقع سهلة خلال دقيقة`);
  render();
 }else{
  alert('فشل التحديث - اتأكد من التوكن');
 }
}
load();
</script>
</body>
                                                              </html>
