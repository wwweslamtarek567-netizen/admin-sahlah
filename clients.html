<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Cairo';background:#f8f8f8;padding-bottom:30px}
.header{background:#007aff;color:#fff;padding:15px 20px;border-radius:0 0 25px 25px;display:flex;justify-content:space-between;align-items:center}
.list-box{background:white;margin:15px 10px;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0 15px 0}
.rider-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer}
.rider-row img{width:45px;height:45px;border-radius:50%}
</style>
</head>
<body>
<div class="header">
  <button onclick="location.href='index.html'" style="background:rgba(0,0,0,.2);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px">‹</button>
  <div style="font-weight:900"><i class="fa-solid fa-user-group"></i> قائمة العملاء <small id="srcClients" style="font-size:10px"></small></div>
  <div></div>
</div>
<div class="list-box">
  <input id="searchClients" class="search" placeholder="ابحث باسم العميل أو رقم الهاتف... 🔍" onkeyup="renderClients()">
  <div id="clientsList">جاري التحميل...</div>
</div>
<script>
let allClients=[];
async function loadClients(){
  try{
    document.getElementById('srcClients').innerText='('+DB_URL.replace('https://','').split('.')[0]+')';
    const res=await fetch(DB_URL+'/clients.json?t='+Date.now()); const data=await res.json();
    if(!data) allClients=[];
    else if(Array.isArray(data)) allClients=data.map((c,i)=>({key:i,phone:String(c.phone||c.id).trim(),name:c.name||'عميل'})).filter(c=>c.phone);
    else allClients=Object.keys(data).map(k=>({key:k,phone:String(data[k].phone||k).trim(),name:data[k].name||'عميل'}));
  }catch(e){document.getElementById('clientsList').innerHTML='<div style="text-align:center;color:#888">مفيش عملاء</div>'; return}
  renderClients();
}
function renderClients(){
  let q=document.getElementById('searchClients').value.toLowerCase().trim();
  let filtered=allClients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  if(filtered.length===0){document.getElementById('clientsList').innerHTML='<div style="text-align:center;padding:20px;color:#888">مفيش عملاء</div>'; return}
  document.getElementById('clientsList').innerHTML=filtered.map(c=>`<div class="rider-row" onclick="location.href='client-details.html?phone=${c.phone}'"><div><i class="fa-solid fa-user" style="color:#007aff"></i></div><div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div style="direction:ltr;font-size:13px;color:#555">${c.phone}</div><b>${c.name}</b></div><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=007aff&color=fff"></div></div>`).join('');
}
loadClients();
</script>
</body>
  </html>
