<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الشحن - سهلة</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#f5f5f5;padding:15px}
.header{background:#ff6a00;color:white;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.header a{color:white;text-decoration:none;background:rgba(0,0,0,0.2);padding:6px 12px;border-radius:8px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.top{display:flex;justify-content:space-between;align-items:center}
.phone{font-weight:800;font-size:16px}
.amount{color:#ff6a00;font-weight:800;font-size:20px}
.amount span{font-size:12px;color:#666}
.time{font-size:12px;color:#999;margin:5px 0}
.status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pending{background:#fff3e0;color:#ff6a00}
.approved{background:#e8f5e9;color:#2e7d32}
.rejected{background:#ffebee;color:#c62828}
img.screenshot{width:100%;max-height:400px;object-fit:contain;border-radius:10px;border:1px solid #eee;margin:10px 0;cursor:pointer}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding:12px;border:none;border-radius:10px;font-family:'Cairo';font-weight:700;cursor:pointer}
.btn-approve{background:#28a745;color:white}
.btn-reject{background:#f0f0f0;color:#333}
.btn-view{background:#ff6a00;color:white;width:100%;margin-top:8px}
.empty{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>

<div class="header">
  <div><i class="fa-solid fa-money-bill-wave"></i> طلبات الشحن - فودافون كاش</div>
  <a href="index.html">رجوع</a>
</div>

<div id="list">جاري التحميل...</div>

<script>
function clean(p){return String(p||'').replace(/\D/g,'');}

async function load(){
  let res = await fetch(DB_URL + '/recharge_requests.json');
  let data = await res.json();
  let list = document.getElementById('list');

  if(!data){
    list.innerHTML = '<div class="empty"><i class="fa-regular fa-folder-open" style="font-size:40px"></i><br>مفيش طلبات شحن حاليا</div>';
    return;
  }

  let html = '';
  // نحول لـ array ونرتب من الجديد للقديم
  let arr = Object.entries(data).sort((a,b)=> (b[1].timestamp||0) - (a[1].timestamp||0));

  arr.forEach(([id, req])=>{
    let date = req.timestamp? new Date(req.timestamp).toLocaleString('ar-EG') : '';
    let statusClass = req.status==='approved'? 'approved' : req.status==='rejected'? 'rejected' : 'pending';
    let statusText = req.status==='approved'? 'تم الشحن' : req.status==='rejected'? 'مرفوض' : 'منتظر تأكيد';

    html += `
    <div class="card" id="card-${id}">
      <div class="top">
        <div class="phone"><i class="fa-solid fa-user"></i> ${req.riderPhone || req.riderKey || 'غير معروف'}</div>
        <div class="amount">${req.amount || 0} <span>جنيه</span></div>
      </div>
      <div class="time"><i class="fa-regular fa-clock"></i> ${date} - ${id.slice(0,6)}</div>
      <span class="status ${statusClass}">${statusText}</span>

      ${req.image? `<img src="${req.image}" class="screenshot" onclick="window.open(this.src)">` : '<p style="color:#999">مفيش صورة مرفقة</p>'}

      ${req.status!=='approved'? `
      <div class="btns">
        <button class="btn-approve" onclick="approve('${id}', '${req.riderKey}', ${req.amount})"><i class="fa-solid fa-check"></i> تأكيد واضافة الرصيد</button>
        <button class="btn-reject" onclick="reject('${id}')"><i class="fa-solid fa-xmark"></i> رفض</button>
      </div>` : ''}
    </div>`;
  });

  list.innerHTML = html;
}

async function approve(reqId, riderKey, amount){
  if(!confirm('تأكيد شحن '+amount+' جنيه للرقم '+riderKey+' ؟')) return;

  try{
    // 1. هات رصيده الحالي
    let r1 = await fetch(DB_URL + '/riders/'+riderKey+'/balance.json');
    let currentBal = await r1.json();
    if(currentBal===null){
      // دور عليه بطريقة تانية
      let all = await (await fetch(DB_URL+'/riders.json')).json();
      for(let k in all){ if(clean(k)===clean(riderKey)){ riderKey=k; currentBal=all[k].balance; break; } }
    }
    currentBal = parseFloat(currentBal)||0;
    let newBal = currentBal + parseFloat(amount);

    // 2. حدث الرصيد
    await fetch(DB_URL + '/riders/'+riderKey+'/balance.json', {method:'PUT', body: JSON.stringify(newBal)});

    // 3. حدث حالة الطلب
    await fetch(DB_URL + '/recharge_requests/'+reqId+'/status.json', {method:'PUT', body: JSON.stringify('approved')});

    alert('تم اضافة '+amount+' جنيه - الرصيد الجديد: '+newBal);
    load();
  }catch(e){ alert('خطأ: '+e.message); }
}

async function reject(reqId){
  if(!confirm('رفض الطلب ده؟')) return;
  await fetch(DB_URL + '/recharge_requests/'+reqId+'/status.json', {method:'PUT', body: JSON.stringify('rejected')});
  load();
}

load();
setInterval(load, 5000);
</script>

</body>
  </html>
